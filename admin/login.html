<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Admin | Miluzza Joias</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="login-box">

    <h1>Miluzza</h1>

    <p>Acesso administrativo</p>

    <form id="loginForm">

        <input 
        type="email" 
        id="email" 
        placeholder="Email"
        required>

        <input 
        type="password" 
        id="password" 
        placeholder="Senha"
        required>

        <button type="submit">
            Entrar
        </button>

        <span id="message"></span>

    </form>

</div>


<script type="module" src="admin.js"></script>


</body>

</html>
