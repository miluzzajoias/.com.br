<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Miluzza · Acesso administrativo</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body class="login-page">


    <main class="login-shell">


        <!-- LOGO -->

        <div class="login-brand">

            <img
                src="../assets/images/logo-transparent.png"
                alt="Miluzza Joias"
            >

        </div>



        <!-- LOGIN -->

        <section class="login-card">


            <p class="eyebrow dark">
                ÁREA RESTRITA
            </p>


            <h1>

                Bem-vinda à<br>

                <em>Miluzza.</em>

            </h1>


            <p class="login-copy">

                Acesse o painel administrativo
                para gerenciar os produtos da sua loja.

            </p>



            <form id="loginForm">


                <label>

                    E-mail

                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >

                </label>



                <label>

                    Senha

                    <input
                        type="password"
                        id="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </label>



                <button
                    type="submit"
                    class="admin-btn"
                >

                    Entrar

                    <span>→</span>

                </button>



                <p
                    id="message"
                    class="form-message"
                ></p>


            </form>


        </section>



        <!-- VOLTAR -->

        <a
            href="../index.html"
            class="back-store"
        >
            ← Voltar para a loja
        </a>


    </main>



    <script
        type="module"
        src="admin.js"
    ></script>


</body>

</html>
